name: client-check

# Проверка десктопного клиента на windows-latest: сервер, клиент, хоткей через SendInput,
# выбор области мышью, окно результата. Запускается только пушем в ветку run/client.
# Скриншоты и отчёт — в artifact client-check и в ветку results (папка client/).
on:
  push:
    branches: ["run/client"]

permissions:
  contents: write

concurrency:
  group: client-check
  cancel-in-progress: false

jobs:
  client:
    name: Клиент на Windows
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      OUT: out/client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Tesseract (Chocolatey)
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          & 'C:\Program Files\Tesseract-OCR\tesseract.exe' --version

      - name: Собрать сервер и клиент
        shell: pwsh
        run: |
          dotnet build EasyLangApi.csproj -c Release
          dotnet build client/EasyLangClient -c Release

      - name: Запустить сервер
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:OUT | Out-Null
          $env:Ocr__TesseractPath = 'C:\Program Files\Tesseract-OCR\tesseract.exe'
          $env:ASPNETCORE_URLS = 'http://localhost:5057'
          Start-Process dotnet -ArgumentList 'bin/Release/net10.0/EasyLangApi.dll' `
            -RedirectStandardOutput "$env:OUT/server.log" -RedirectStandardError "$env:OUT/server.err.log"
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-RestMethod http://localhost:5057/health; break } catch { Start-Sleep 2 }
          }

      - name: Тестовый пользователь и settings.json клиента
        shell: pwsh
        run: |
          $password = [Convert]::ToHexString([Security.Cryptography.RandomNumberGenerator]::GetBytes(16)).ToLower()
          Write-Host "::add-mask::$password"
          $email = 'client-check@example.com'
          Invoke-RestMethod -Method Post -Uri http://localhost:5057/auth/register -ContentType 'application/json' `
            -Body (@{ email = $email; password = $password } | ConvertTo-Json) | Out-Null
          "CLIENT_PASSWORD=$password" >> $env:GITHUB_ENV
          $settings = 'client/EasyLangClient/bin/Release/net10.0-windows/settings.json'
          $s = Get-Content $settings -Raw | ConvertFrom-Json
          $s.email = $email
          $s | ConvertTo-Json | Set-Content $settings
          Get-Content $settings

      - name: Проверка клиента
        shell: pwsh
        timeout-minutes: 10
        run: |
          $exe = (Resolve-Path 'client/EasyLangClient/bin/Release/net10.0-windows/EasyLangClient.exe').Path
          ./tools/client-check.ps1 -ClientExe $exe -Password $env:CLIENT_PASSWORD -OutDir $env:OUT

      - name: Artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: client-check
          path: out/client

      - name: В ветку results
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/push-results.sh client "$OUT"
